<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>

<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one-column phone app, sticky tab bar at bottom, cards only where a thing is a separate object. Exam-paper ink + highlighter. */
:root{
  --paper:#f6f7fb; --sheet:#ffffff; --ink:#16203a; --ink-2:#4a5470; --rule:#dde1ec;
  --accent:#2440b8; --accent-ink:#ffffff; --hl:#fff07a; --hl-ink:#16203a;
  --good:#1e7a4c; --warn:#b06a00; --bad:#b4232c; --good-bg:#e3f4ea; --bad-bg:#fbe6e7; --warn-bg:#fdf1dc;
  --c-maths:#2440b8; --c-science:#1e7a4c; --c-englang:#7b3fa0; --c-englit:#b4232c; --c-geography:#0b7a85;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1424; --sheet:#171e33; --ink:#e8ecf7; --ink-2:#a3acc6; --rule:#2a3350;
  --accent:#8fa6ff; --accent-ink:#0f1424; --hl:#e8d84a; --hl-ink:#151515;
  --good:#5fd39a; --warn:#f0b04a; --bad:#ff7f86; --good-bg:#16352a; --bad-bg:#3a1c22; --warn-bg:#3a2c14;
  --c-maths:#8fa6ff; --c-science:#5fd39a; --c-englang:#c99af0; --c-englit:#ff8a90; --c-geography:#5ccfd9;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1424; --sheet:#171e33; --ink:#e8ecf7; --ink-2:#a3acc6; --rule:#2a3350;
  --accent:#8fa6ff; --accent-ink:#0f1424; --hl:#e8d84a; --hl-ink:#151515;
  --good:#5fd39a; --warn:#f0b04a; --bad:#ff7f86; --good-bg:#16352a; --bad-bg:#3a1c22; --warn-bg:#3a2c14;
  --c-maths:#8fa6ff; --c-science:#5fd39a; --c-englang:#c99af0; --c-englit:#ff8a90; --c-geography:#5ccfd9;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:20px 12px;flex-wrap:wrap}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.btn{font:inherit;font-weight:700;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);cursor:pointer;font-family:inherit}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.subjtag{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem}
.banner{border-radius:8px;padding:10px 12px;font-size:.9rem;background:var(--warn-bg);color:var(--ink)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{flex:1;max-width:130px;background:none;border:0;color:var(--ink-2);font:inherit;font-size:.74rem;font-weight:700;padding:8px 2px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
/* grade strip */
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.gcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--sc)}
.gbig{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1}
.bar{height:8px;background:var(--rule);border-radius:4px;position:relative;overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--sc,var(--accent))}
.bar>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.bar>u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);opacity:.6}
/* task list */
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.task:last-child{border-bottom:0}
.task .tx{flex:1;min-width:0}
.cq .tick{display:none}
.cq > .btn{width:100%;justify-content:center}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.tick.done{background:var(--good);border-color:var(--good)}
/* question */
.qtext{white-space:pre-wrap;font-size:1.05rem;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:inherit;padding:12px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;white-space:pre-wrap;min-height:44px}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.ms{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ms label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.ms input{width:22px;height:22px;flex:none;margin-top:1px}
.model{white-space:pre-wrap;background:var(--paper);border-left:3px solid var(--hl);padding:10px 12px;border-radius:0 6px 6px 0;overflow-wrap:anywhere}
.tip{font-size:.92rem;background:var(--hl);color:var(--hl-ink);padding:8px 10px;border-radius:6px}
textarea,input[type=text],input[type=number],input[type=date],select{font:inherit;width:100%;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink)}
textarea{min-height:140px;resize:vertical}
.lvl{font-family:var(--f-mono);font-size:.72rem;font-weight:700;padding:2px 6px;border-radius:4px;border:1px solid currentColor}
.progress{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent)}
/* topic list */
.topic{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.topic .nm{min-width:0;font-weight:700}
.topic .bar{grid-column:1/2}
/* flashcard */
.fcard{min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;cursor:pointer;padding:24px;font-size:1.15rem;white-space:pre-wrap;overflow-wrap:anywhere}
.fcard .back{border-top:2px dashed var(--rule);padding-top:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.tablewrap{overflow-x:auto}
.week{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--rule)}
.week.now{background:linear-gradient(90deg,var(--hl) 0 6px,transparent 6px)}
.week .wk{font-family:var(--f-mono);font-weight:700;font-size:.85rem;padding-left:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
details summary{cursor:pointer;font-weight:700}
.spark{width:100%;height:56px;display:block}
.empty{padding:20px;text-align:center;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.tab{transition:background .15s,border-color .15s}}
</style>

/* mastery: Mastered = 85%+ on G8-9 questions on two days 7+ days apart AND last blurt 80%+ */
function mastery(sid,tid,o){
  const l3=D("l3_"+sid)[tid]||{};
  const good=Object.entries(l3).filter(([d,v])=>v[1]>=3&&v[0]/v[1]>=.85).map(([d])=>dnum(pkey(d))).sort((a,b)=>a-b);
  const spaced=good.length>=2&&good[good.length-1]-good[0]>=7;
  const bl=D("blurt_"+sid)[tid]||[];const lastB=bl.length?bl[bl.length-1].p:null;
  const lastL3=Object.keys(l3).sort().pop();const age=lastL3?dnum()-dnum(pkey(lastL3)):999;
  if(spaced&&(NOBLURT.includes(sid)||(lastB!=null&&lastB>=80)))return {s:"Mastered",k:4,retest:age>=18};
  if(o.pct!=null&&o.pct>=75&&o.cov>=.5)return {s:"Secure",k:3,why:!spaced?"needs 85%+ on G8-9 twice, a week apart":(NOBLURT.includes(sid)?"needs 85%+ on G8-9 twice":"needs a blurt at 80%+")};
  if(o.att||o.real)return {s:"Learning",k:2};return {s:"Not started",k:1};
}

/* ===== analytics ===== */
function topicStats(sid){
  const qa=D("qa_"+sid), d=DATA[sid], out={};
  d.topics.forEach(t=>out[t.id]={id:t.id,name:t.name,g:0,m:0,att:0,total:0});
  d.questions.forEach(q=>{const o=out[q.topic];if(!o)return;o.total++;const a=qa[q.id];if(a){o.att++;const w=LW[q.level]||1;o.g+=a.g*w;o.m+=a.m*w}});
  // real past-paper questions done on this topic count too (latest two sessions)
  const rq=D("realq_"+sid);Object.entries(rq).forEach(([tid,arr])=>{const o=out[tid];if(!o)return;arr.slice(-2).forEach(x=>{o.g+=x.g;o.m+=x.m});o.real=arr[arr.length-1]});
  Object.values(out).forEach(o=>{o.pct=o.m?Math.round(100*o.g/o.m):null;o.cov=o.total?o.att/o.total:0});
  return out;
}
/* Real Higher papers spread marks across grade bands, so the bank % is the average of the
   band %s (G4-5, G6-7, G8-9) in equal shares, not skewed by whichever level you happened to practise most. */
const BANDSHARE={1:1/3,2:1/3,3:1/3};
function subjectStats(sid){
  const ts=Object.values(topicStats(sid)); let att=0,total=0,touched=0;
  ts.forEach(t=>{att+=t.att;total+=t.total;if(t.att)touched++});
  const qa=D("qa_"+sid);const band={1:[0,0],2:[0,0],3:[0,0]};
  DATA[sid].questions.forEach(q=>{const a=qa[q.id];if(a&&band[q.level]){band[q.level][0]+=a.g;band[q.level][1]+=a.m}});
  let w=0,acc=0;[1,2,3].forEach(l=>{if(band[l][1]){acc+=BANDSHARE[l]*band[l][0]/band[l][1];w+=BANDSHARE[l]}});
  // a band with no attempts yet counts at half the attempted average, so an untested G8-9 band can't hide
  let qb=null;if(w){const avg=acc/w;[1,2,3].forEach(l=>{if(!band[l][1]){acc+=BANDSHARE[l]*avg*0.5;w+=BANDSHARE[l]}});qb=100*acc/w}
  const papers=(D("papers").list||[]).filter(p=>p.subject===sid).sort((a,b)=>b.date<a.date?-1:1).slice(0,3);
  const pp=papers.length?papers.reduce((s,p)=>s+100*p.score/p.max,0)/papers.length:null;
  let pred=null; if(pp!=null&&qb!=null)pred=0.65*pp+0.35*qb; else pred=pp!=null?pp:qb;
  const topicCov=ts.length?touched/ts.length:0;
  const conf=pp!=null?"Based on real papers":topicCov>=.8?"Good coverage":topicCov>=.4?"Partial coverage":att?"Early estimate":"No data yet";
  return {qb,pp,pred,att,total,topicCov,conf,papers:papers.length,band};
}
function gradeFor(s,p){ if(p==null)return "–"; const mk=p/100*s.max; for(const [g,b] of s.b26){if(mk>=b)return String(g)} return s.double?"<4-4":"<4"}
function nineLine(s){return 100*s.b26[0][1]/s.max}
/* topic weight = its area's share of exam marks (from the board's spec) split across the area's topics */
function topicWeight(sid,tid){const P=PROFILE[sid];const d=DATA[sid];const t=d.topicMap[tid];if(!P||!P.topicWeights||!t)return 1;
  const A=String(t.area||"").toLowerCase();if(!A)return 1;
  const area=P.topicWeights.find(x=>String(x[0]).toLowerCase()===A)||P.topicWeights.find(x=>{const k=String(x[0]).toLowerCase();return k.includes(A)||A.includes(k.split(/[ /(]/)[0])});if(!area)return 1;
  // topics whose area shares this weight band (e.g. Statistics + Probability share one spec band)
  const n=d.topics.filter(x=>{const B=String(x.area||"").toLowerCase();const k=String(area[0]).toLowerCase();return B===A||k.includes(B)}).length||1;const avg=100/(d.topics.length||1);return (area[1]/n)/avg}
/* Health: a topic's score fades if you don't touch it. Faster for shaky topics, slower once mastered. */
const TAU={1:4,2:6,3:12,4:25};
function lastTouch(sid){const out={};const up=(tid,t)=>{if(t>(out[tid]||0))out[tid]=t};
  Object.entries(D("qa_"+sid)).forEach(([id,a])=>{const q=QIDX[id];if(q)up(q.topic,a.t)});
  Object.entries(D("blurt_"+sid)).forEach(([tid,arr])=>arr.forEach(x=>up(tid,pkey(x.d).getTime()+43200000)));
  Object.entries(D("realq_"+sid)).forEach(([tid,arr])=>arr.forEach(x=>up(tid,pkey(x.d).getTime()+43200000)));
  return out}
function topicHealth(sid){const ts=topicStats(sid);const lt=lastTouch(sid);const now=Date.now();
  return Object.values(ts).map(t=>{const m=mastery(sid,t.id,t);const last=lt[t.id];
    if(t.pct==null||!last)return {...t,sid,m,health:null,days:null,fading:false};
    const days=(now-last)/864e5;const h=Math.round(t.pct*Math.exp(-0.357*days/TAU[m.k]));
    return {...t,sid,m,health:h,days:Math.floor(days),fading:days>TAU[m.k]&&h<t.pct-8}})}
function weakTopics(sid,n){
  // priority = marks still to win (using faded health) x how many exam marks the topic carries
  return topicHealth(sid).filter(t=>!(t.m.k===4&&!t.fading)).map(t=>({...t,prio:(t.health==null?110:100-t.health)*topicWeight(sid,t.id)}))
    .sort((a,b)=>b.prio-a.prio||a.cov-b.cov).slice(0,n);
}
function fadingTopics(n){const all=[];SUBJ.forEach(s=>topicHealth(s.id).forEach(t=>{if(t.fading)all.push(t)}));return all.sort((a,b)=>(a.health-a.pct)-(b.health-b.pct)).slice(0,n)}

  View.session={title,kind,sid,items:qs.map(q=>q.id),i:0,res:[],state:{},timed:!!View.timed&&kind!=="baseline",qStart:Date.now(),over:0};View.busy=true;render();window.scrollTo(0,0)}
function alertMsg(m){View.flash=m;render()}
function startBaseline(sid){const qs=DATA[sid].questions.filter(q=>q.baseline);startSession(`${SMAP[sid].name} baseline`,qs,"baseline",sid)}
function pickTopicQs(sid,tid,lvl,n=10){
  const qa=D("qa_"+sid);let pool=DATA[sid].questions.filter(q=>(!tid||q.topic===tid)&&(!lvl||(lvl===23?q.level>=2:q.level===lvl)));
  if(lvl&&pool.length<4)pool=DATA[sid].questions.filter(q=>(!tid||q.topic===tid)&&q.level>=2);
  const unseen=shuffle(pool.filter(q=>!qa[q.id])), weak=shuffle(pool.filter(q=>qa[q.id]&&qa[q.id].g/qa[q.id].m<.7)), rest=shuffle(pool.filter(q=>qa[q.id]&&qa[q.id].g/qa[q.id].m>=.7));
  return [...unseen.slice(0,n-2),...weak,...unseen.slice(n-2),...rest].slice(0,n).sort((a,b)=>a.level-b.level);
}
function startTopic(sid,tid,lvl){const t=tid?DATA[sid].topicMap[tid]:null;startSession(`${SMAP[sid].short}: ${t?t.name:"mixed topics"}`,pickTopicQs(sid,tid,lvl),"topic",sid);if(View.session)View.session.realTopic=tid||null}
function startMistakes(sid){const out=[];SUBJ.filter(s=>!sid||s.id===sid).forEach(s=>{const qa=D("qa_"+s.id);Object.entries(qa).forEach(([id,a])=>{if(a.g/a.m<.6&&QIDX[id])out.push(QIDX[id])})});
  startSession("Mistakes review",shuffle(out).slice(0,12),"mistakes",sid)}

}
async function claudeMark(){const S=View.session;if(!S)return;const q=QIDX[S.items[S.i]];const st=S.state;const ans=(st.text||"").trim();
  if(ans.length<15){st.cm="Write a real answer first, then ask for marking.";render();return}
  st.cmBusy=true;render();
  try{const sample=await claude.use("sample");if(!sample)throw new Error("na");
   const r=await sample(`You are an experienced GCSE examiner marking one answer for a 15 year old.\nSubject: ${SMAP[q.subject].name} (${SMAP[q.subject].board}).\nQuestion (${q.marks} marks): ${q.q}\nMark scheme points: ${(q.ms||[]).join(" | ")}\nModel answer: ${q.answer}\nStudent answer: ${ans}\n\nReply in this exact shape, plain words, no markdown:\nSuggested mark: X/${q.marks}\nGot: one short line per mark earned\nMissed: one short line per mark missed and what to add\nBe strict like a real examiner. Do not give marks for vague points.`,{modelTier:"default"});
   st.cm=r.text||"No reply."}catch(e){st.cm="Claude marking isn't available right now. Mark it yourself against the scheme."}
  st.cmBusy=false;if(View.session===S)render()}
function finishQ(g){const S=View.session;const q=QIDX[S.items[S.i]];
  recordAttempt(q,g,q.marks,S.kind);S.res.push({id:q.id,g,m:q.marks});
  if(q.type!=="mcq"&&S.state.text&&S.state.text.trim())saveAnswer(q.id,{text:S.state.text.slice(0,3000),g,m:q.marks,t:Date.now(),subject:q.subject});
  if(S.timed&&(Date.now()-S.qStart)/1000>q.marks*PACE[q.subject])S.over++;
  S.i++;S.state={};S.qStart=Date.now();render();window.scrollTo(0,0)}

    b[S.sid]={g,m,date:dkey(),topics:bt};save("baseline")}
  const s=S.sid?SMAP[S.sid]:null;
  // target check for a Today block: hit it (or 3 rounds) and the item ticks off; miss it and go again with fresh questions
  let tgt="";const B=S.block;
  if(B&&B.key&&!S.judged){S.judged=true;const need=B.kind==="drill"?TARGET.drill:TARGET.topic;S.hit=pct(g,m)>=need;S.need=need;
    if(S.hit||B.round>=3)markTask(B.key,pct(g,m))}

    :`<p class="banner" style="background:var(--bad-bg)">${pct(g,m)}%, target is ${S.need}%. Go again with fresh questions (round ${B.round+1} of 3).</p><button class="btn primary" data-goagain>Go again</button>`}
  return `<div class="stack" style="padding-top:20px"><div class="eyebrow">${esc(S.title)}</div><h1>${g} / ${m} <span class="muted">(${pct(g,m)}%)</span></h1>${tgt}
  ${s&&S.kind==="baseline"?`<p>Starting point: that's roughly a <span class="hl">grade ${esc(gradeFor(s,pct(g,m)))}</span> standard in ${esc(s.name)}. The Today list now builds your sessions around your weakest topics.</p>`:""}
  ${S.timed?`<p class="small">${S.over?`Over time on ${S.over} of ${S.res.length}. Speed is part of the target.`:"All inside exam pace."}</p>`:""}
  <p class="muted">${pct(g,m)>=GOAL_PCT?"At the 90% goal. Move up a level next time.":pct(g,m)>=70?"Solid. The dropped marks are listed below; they come back in Mistakes review.":"These topics need another pass. Every question under 60% is queued in Mistakes review."}</p>
  <div class="sheet"><table><thead><tr><th>Question</th><th>Marks</th></tr></thead><tbody>${S.res.map(r=>{const q=QIDX[r.id];return `<tr><td>${esc((DATA[q.subject].topicMap[q.topic]||{}).name||"")} <span class="small muted">${LVL[q.level]||""}</span></td><td class="mono" style="color:${r.g/r.m>=.6?"var(--good)":"var(--bad)"}">${r.g}/${r.m}</td></tr>`}).join("")}</tbody></table></div>
  ${S.realTopic&&!(S.block&&S.block.key)?(()=>{const t=DATA[S.sid].topicMap[S.realTopic];return S.realSaved?`<p class="small" style="color:var(--good)">Real exam questions logged.</p>`:`<section class="sheet stack" style="border-left:4px solid var(--hl)"><div class="eyebrow">Step 2 of 2</div><h3>Real exam questions: ${esc(t?t.name:"")}</h3>
    <p class="small">Open the real past-paper questions on this topic, do them on paper (at least 20 marks' worth), mark them with the mark scheme on that page, then enter the total.</p>

const BLURT_SECS=480;
function startBlurt(sid,tid,key){const cards=DATA[sid].flashcards.filter(c=>c.topic===tid);
  if(!cards.length){alertMsg("No key points for that topic yet.");return}
  const cs0=D("cards_"+sid);const n=sid==="maths"?4:5;const set=shuffle(cards.slice()).sort((a,b)=>((cs0[a.id]||[0])[0])-((cs0[b.id]||[0])[0])).slice(0,Math.min(n,cards.length)).map(c=>c.id);
   View.blurt={sid,tid,key,set,start:Date.now(),text:"",phase:"write",ticks:{}};View.busy=true;render();window.scrollTo(0,0)}
function fmtT(s){const a=Math.abs(s);return (s<0?"+":"")+Math.floor(a/60)+":"+pad(a%60)}
function renderBlurt(){const B=View.blurt;const t=DATA[B.sid].topicMap[B.tid];const cards=B.set.map(id=>CIDX[id]).filter(Boolean);
  const head=`<div class="row" style="justify-content:space-between"><button class="btn ghost" data-quit>← Exit</button></div>
  <div class="eyebrow">Blurt · ${esc(SMAP[B.sid].short)}</div><h1>${esc(t?t.name:"")}</h1>`;
  if(B.phase==="write")return `<div class="stack" style="padding-top:16px">${head}<p class="muted">${cards.length} specific things from this topic. Close your notes and write ${B.sid==="maths"?"the formula or method steps for each, then one quick worked example":"everything you can remember about each one"}. Bullets are fine.</p><ol class="stack" style="gap:6px;padding-left:20px;margin:0">${cards.map(c=>`<li><b>${esc(c.front)}</b></li>`).join("")}</ol>
    <label class="small muted" for="blurt">Your answers</label><textarea id="blurt" style="min-height:180px">${esc(B.text)}</textarea><button class="btn primary" data-bcheck>Done, check it</button></div>`;
  const got=Object.values(B.ticks).filter(Boolean).length;
  return `<div class="stack" style="padding-top:16px">${head}<p>Tick every point you got down (roughly is fine, but it has to be there). Anything unticked becomes a flashcard due tomorrow.</p>
  <details><summary>Your blurt</summary><div class="model" style="margin-top:8px">${esc(B.text||"(empty)")}</div></details>
  <div class="sheet"><ul class="ms">${cards.map(c=>`<li><label><input type="checkbox" data-bt="${esc(c.id)}" ${B.ticks[c.id]?"checked":""}> <span><b>${esc(c.front)}</b><br><span class="small muted">${esc(c.back)}</span></span></label></li>`).join("")}</ul></div>
  <div class="row"><span class="mono" id="bscore">${got}/${cards.length}</span><button class="btn primary" data-bsave>Save blurt</button></div></div>`}
function saveBlurt(){const B=View.blurt;const cards=B.set.map(id=>CIDX[id]).filter(Boolean);const got=cards.filter(c=>B.ticks[c.id]).length;const p=pct(got,cards.length);
  const bd=D("blurt_"+B.sid);bd[B.tid]=[...(bd[B.tid]||[]),{d:dkey(),p}].slice(-6);save("blurt_"+B.sid);
  const cs=D("cards_"+B.sid);const now=dnum();cards.forEach(c=>{if(!B.ticks[c.id]){const st=cs[c.id];cs[c.id]=[1,now+1,st?st[2]:now]}});save("cards_"+B.sid);
  saveAnswer("blurt-"+B.tid,{text:B.text.slice(0,3000),g:got,m:cards.length,t:Date.now(),subject:B.sid,blurt:true});
  const tries=(bd[B.tid]||[]).filter(x=>x.d===dkey()).length;
  if(B.key&&(p>=TARGET.blurt||tries>=2))markTask(B.key,p);
  const msg=p>=TARGET.blurt?`Blurt target hit: ${got}/${cards.length} (${p}%).`:tries>=2?`${p}% on the second go. Ticked off; the ${cards.length-got} missed points are flashcards tomorrow.`:`${p}%, target is ${TARGET.blurt}%. Read the missed points once, wait 20 minutes, then blurt it again from Today.`;
  View.blurt=null;View.busy=false;go("today");View.flash=msg;render()}

const STUDY={englang:["It's a skills exam, not a facts exam. You get better by doing questions, marking them and fixing them, not by memorising.","For each question type: learn the method (the steps and the marks), do two or three, compare with the model answer and level descriptors, then rewrite your weakest paragraph.","Reading questions: short quotes, zoom in on single words, and always say the effect on the reader and why the writer did it. Q4 needs a judgement with several quotes.","Writing (Q5 is 40 marks twice): plan for 5 minutes, then write. Use ambitious but accurate vocabulary and varied sentences. Do one piece a week and get it marked.","Technical accuracy is 16 of the 40 marks on each Q5. The SPaG cards are worth learning properly.","Read one short extract a day (news, fiction, a speech). Pick one word or line and say why it works. This builds the instinct the reading questions test.","The flashcards here are a toolkit: terms, SPaG, vocab and question methods. There is no blurting for this subject."],englit:["Learn a small set of short quotes for each text and tag each to two or three themes. Examiners credit paraphrase, so word-perfect recall isn't needed.","Plan every essay in 5 minutes with a clear argument, then write. Do one full essay a week and get it marked.","Know the context for AO3, but only use it where it explains something in the text."],maths:["Learn the method from the Learn link, then do the real exam questions. Don't just re-read.","Do a mix of topics once you know the methods. It sticks better than doing one topic over and over.","Show every step. Method marks are most of the marks on hard questions."]};
const HOWTO={englit:[
["Every essay: the paragraph recipe","1. Point that uses the question's key word.|2. Short quote (1 to 6 words) woven into your sentence.|3. Zoom in on one word or method and say what it suggests.|4. Say what the writer wants the audience to think.|5. Link to another moment in the text or to context that explains the idea."],
["Macbeth / An Inspector Calls (34 marks, about 45-50 min)","Underline the key word. Write a one-sentence thesis that answers it.|Plan 3 or 4 points: the extract, earlier, later, the ending.|2-3 line intro: answer the question, no story summary.|3 or 4 paragraphs with the recipe. Use the whole text, not just the extract.|Context only where it explains the idea: \"this isn't GCSE History\" (examiner report).|Last 3 minutes: proofread. 4 marks are spelling, punctuation and grammar."],
["A Christmas Carol (30 marks, about 40-45 min)","Same plan as Macbeth, no spelling marks.|Track change: Stave 1, middle, Stave 5.|Methods: contrast (Fred, Cratchits), motifs (cold, light, fire, food), the ghosts, Ignorance and Want.|Two sentences of context at most, tied to Dickens' message."],
["Power and Conflict comparison (30 marks, about 45 min)","Read the printed poem and underline the question's key word.|Pick the second poem you know best, within a minute.|Intro: the shared idea and one difference.|Paragraph on poem 1, paragraph on poem 2, then a compare paragraph using whereas / similarly / in contrast.|Write about ideas (abuse of power, fear of nature), not just what happens.|Don't misread: in My Last Duchess the Duke is not grieving."],
["Unseen poetry (24 + 8 marks, about 45 min)","Read the question before the poem: it gives you a steer.|Read twice: who speaks, what changes, how it ends.|Q1: one-line idea, then go through the poem start to end. Every method needs its effect.|Don't technique-spot or talk about rhyme scheme unless it clearly does something.|Q2 (about 10 min): compare methods and effects of both poems in one or two paragraphs."]],

["Paper 1 Q3 structure (8 marks, 10 min)","Cover the whole extract: start, middle, end.|What does the writer focus on, what shifts, why does it happen now?|Use shift, contrast, climax, foreshadowing. Never write \"makes the reader read on\"."],
["Paper 1 Q4 evaluate (20 marks, 20 min)","Decide how far you agree and say it in your first line.|4 or 5 developed paragraphs: point, quote, language or structure, effect, link back to the statement.|Use the ending of the extract. Stay on the statement."],
["Q5 writing (40 marks, 45 min, both papers)","5 min plan, 35 min write, 5 min check.|Paper 1: one moment, not a whole journey. Open with an image, zoom in, a small turn, echo the opening at the end.|Paper 2: one clear view, three arguments from different angles, answer one counter-argument, match the form (speech, letter, article).|No templates or stock phrases. 16 of the 40 marks are spelling, punctuation and sentence variety."],

function sparkSvg(sid){const dd=D("daily");const keys=Object.keys(dd).sort();const wk={};keys.forEach(k=>{const o=dd[k][sid];if(!o||!o.m)return;const d=new Date(k);const w=Math.floor((dnum(d)-dnum(START))/7);wk[w]=wk[w]||[0,0];wk[w][0]+=o.g;wk[w][1]+=o.m});
  const ws=Object.keys(wk).map(Number).sort((a,b)=>a-b).slice(-12);if(ws.length<2)return `<p class="small muted">Trend appears after two weeks of practice.</p>`;
  const W=300,H=56,P=4;const xs=i=>P+i*(W-2*P)/(ws.length-1);const ys=v=>H-P-(v/100)*(H-2*P);
  const pts=ws.map((w,i)=>[xs(i),ys(100*wk[w][0]/wk[w][1])]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Weekly % trend"><line x1="0" x2="${W}" y1="${ys(90)}" y2="${ys(90)}" stroke="var(--rule)" stroke-dasharray="3 3"/><path d="M${pts.map(p=>p.join(",")).join("L")}L${pts[pts.length-1][0]},${H}L${pts[0][0]},${H}Z" fill="var(--c-${sid})" opacity=".12"/><polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--c-${sid})" stroke-width="2"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="var(--c-${sid})"/></svg>`}

  if(ds.next!==undefined){const S=View.session;const q=QIDX[S.items[S.i]];finishQ(S.state.picked===q.answer?1:0);return}
  if(ds.show!==undefined){const S=View.session;S.state.text=($("#ans")||{}).value||"";S.state.shown=true;S.state.ticks={};render();return}
  if(ds.savemark!==undefined){const S=View.session;const q=QIDX[S.items[S.i]];let g;
    if((q.ms||[]).length===q.marks){g=document.querySelectorAll("[data-mk]:checked").length}else{g=Math.max(0,Math.min(q.marks,parseInt(($("#mkn")||{}).value)||0))}
    finishQ(g);return}
  if(ds.cdk!==undefined){const K=View.deck;K.typed="";K.dk=true;K.match=0;K.flip=true;render();return}
  if(ds.flip!==undefined){const K=View.deck;const v=(($("#cans")||{}).value||"").trim();if(v.length<2){K.need=true;render();return}const c=CIDX[K.items[K.i]];K.typed=v;K.match=kmatch(v,c.back);K.flip=true;K.need=false;render();return}
  if(ds.card!==undefined)return gradeCard(ds.card==="1");
  if(ds.dtopic){const [sd,td]=ds.dtopic.split("|");return startTopicDeck(sd,td)}
  if(ds.deck!==undefined)return startDeck(ds.deck||null);
  if(ds.psub){View.pSub=ds.psub;render();return}
  if(ds.plvl!==undefined){View.pLvl=+ds.plvl;render();return}
  if(ds.ptopic)return startTopic(View.pSub,ds.ptopic,View.pLvl);
  if(ds.mixed!==undefined)return startTopic(View.pSub,null,View.pLvl);
  if(ds.mist!==undefined)return startMistakes(View.pSub);
  if(ds.base!==undefined)return startBaseline(View.pSub);
  if(ds.wt){const [s,tp]=ds.wt.split("|");return startTopic(s,tp,0)}
  if(ds.rlog){View.rlog=View.rlog===ds.rlog?null:ds.rlog;render();return}
  if(ds.rlsave){const g=parseInt(($("#rl-g")||{}).value),m=parseInt(($("#rl-m")||{}).value);if(!(m>0&&g>=0&&g<=m)){View.flash="Enter marks scored and marks available.";render();return}
    const rq=D("realq_"+View.pSub);rq[ds.rlsave]=[...(rq[ds.rlsave]||[]),{d:dkey(),g,m}].slice(-6);save("realq_"+View.pSub);View.rlog=null;View.flash=`Saved: ${g}/${m} (${pct(g,m)}%) on real questions.`;render();return}
  if(ds.ptimer){View.ptimer={end:Date.now()+(+ds.ptimer)*60000};render();return}
  if(ds.ptstop!==undefined){View.ptimer=null;render();return}
  if(ds.claudemark!==undefined){return claudeMark()}
  if(ds.mapopen){View.mapOpen[ds.mapopen]=!View.mapOpen[ds.mapopen];render();return}
  if(ds.maptopic){const [s,tp]=ds.maptopic.split("|");return runBlock({kind:"topic",sid:s,topic:tp,round:1})}
  if(ds.rtsave!==undefined){const i=+ds.rtsave;const t=todayTasks()[i];if(!t)return;const g=parseInt(($("#rt-g-"+i)||{}).value),m=parseInt(($("#rt-m-"+i)||{}).value);
    if(!(m>0&&g>=0&&g<=m)){View.flash="Enter marks scored and marks available.";render();return}
    const rq=D("realq_"+t.sid);rq[t.topic]=[...(rq[t.topic]||[]),{d:dkey(),g,m}].slice(-6);save("realq_"+t.sid);
    const p=pct(g,m);if(p>=TARGET.topic)markTask(t.key,p);
    View.flash=p>=TARGET.topic?`Real questions: ${g}/${m} (${p}%). Target hit.`:`Real questions: ${g}/${m} (${p}%). Now do step 2: fresh app questions until you hit ${TARGET.topic}%.`;render();return}
  if(ds.goagain!==undefined){const B=View.session.block;return runBlock({...B,round:B.round+1})}
  if(ds.tpsave!==undefined){const t=todayTasks()[+ds.tpsave];if(!t||!t.paper)return;const sc=parseInt(($("#tp-score")||{}).value);
    if(!(sc>=0&&sc<=t.paper.marks)){View.flash=`Enter a score between 0 and ${t.paper.marks}.`;render();return}
    const p=D("papers");p.list=p.list||[];p.list.push({id:"p"+Date.now(),pid:t.paper.id,subject:t.sid,name:t.paper.name,score:sc,max:t.paper.marks,date:dkey(),redo:(($("#tp-redo")||{}).value||"").trim().slice(0,120),corr:false});
    save("papers");View.flash=`Logged: ${sc}/${t.paper.marks} (${pct(sc,t.paper.marks)}%).`;render();return}
  if(ds.rqsave!==undefined){const S=View.session;const g=parseInt(($("#rq-g")||{}).value),m=parseInt(($("#rq-m")||{}).value);
    if(!(m>0&&g>=0&&g<=m)){View.flash="Enter marks scored and marks available.";render();return}
    const tid=S.realTopic;const rq=D("realq_"+S.sid);rq[tid]=[...(rq[tid]||[]),{d:dkey(),g,m}].slice(-6);save("realq_"+S.sid);bumpDaily(S.sid,"q",0);
    S.realSaved=true;render();return}
  if(ds.timed!==undefined){View.timed=!View.timed;render();return}
  if(ds.blurt)return startBlurt(View.pSub,ds.blurt);
  if(ds.bcheck!==undefined){const B=View.blurt;B.text=($("#blurt")||{}).value||"";B.phase="check";render();window.scrollTo(0,0);return}
  if(ds.bsave!==undefined)return saveBlurt();
  if(ds.rep!==undefined){View.session.state.rep=true;render();return}
  if(ds.repx!==undefined){View.session.state.rep=false;render();return}
  if(ds.repsend!==undefined){const S=View.session;const q=QIDX[S.items[S.i]];const txt=(($("#rep")||{}).value||"").trim();if(txt){sendReport({qid:q.id,subject:q.subject,text:txt.slice(0,500),t:Date.now()})}S.state.rep=false;View.flash=txt?"Reported. Mo will see it in the Tracker.":"";render();return}
  if(ds.corr){const p=D("papers");const x=(p.list||[]).find(y=>y.id===ds.corr);if(x){x.corr=true;save("papers")}render();return}
  if(ds.remark){const id=ds.remark;const all=allAnswers();const a=all[id];const q=QIDX[id];const v=Math.max(0,Math.min(a.m,parseInt(($("#rm-"+CSS.escape(id))||{}).value)||0));
    const doc=D("qa_"+q.subject);if(doc[id]){doc[id].g=v;save("qa_"+q.subject)}saveAnswer(id,{...a,g:v,remarked:true});View.flash="Mark updated.";render();return}
  if(ds.pick!==undefined){View.pick=+ds.pick;render();window.scrollTo(0,0);return}
  if(ds.delask){View.delAsk=ds.delask;render();return}
  if(ds.delp){View.delAsk=null;const p=D("papers");p.list=(p.list||[]).filter(x=>x.id!==ds.delp);save("papers");render();return}
});
document.addEventListener("change",e=>{if(e.target.matches("[data-bt]")&&View.blurt){View.blurt.ticks[e.target.dataset.bt]=e.target.checked;const n=Object.values(View.blurt.ticks).filter(Boolean).length;const el=$("#bscore");if(el)el.textContent=n+"/"+((View.blurt.set&&View.blurt.set.length)||DATA[View.blurt.sid].flashcards.filter(c=>c.topic===View.blurt.tid).length)}if(e.target.matches("[data-mk]")){const S=View.session;if(S){S.state.ticks=S.state.ticks||{};S.state.ticks[e.target.dataset.mk]=e.target.checked}}
  if(e.target.id==="mkn"&&View.session)View.session.state.n=e.target.value});
document.addEventListener("input",e=>{if(e.target.id==="blurt"&&View.blurt)View.blurt.text=e.target.value;if(e.target.id==="ans"&&View.session)View.session.state.text=e.target.value});
document.addEventListener("submit",e=>{if(e.target.id!=="pform")return;e.preventDefault();
  const score=+$("#p-score").value,max=+$("#p-max").value;const msg=$("#p-msg");
  if(!(max>0)||score<0||score>max){msg.textContent="Score must be between 0 and the paper total.";return}
  const p=D("papers");p.list=p.list||[];p.list.push({id:"p"+Date.now(),subject:$("#p-sub").value,name:$("#p-name").value.trim().slice(0,80),score,max,date:$("#p-date").value||dkey(),redo:$("#p-redo").value.trim().slice(0,120),corr:false});
  save("papers");render();const m2=$("#p-msg");if(m2)m2.textContent="Saved."});

/* ===== boot ===== */
(async()=>{const h=location.hash.slice(1);if(ROUTES.includes(h))View.tab=h;
  await loadData();render();initStore();})();
</script>

</body></html>
